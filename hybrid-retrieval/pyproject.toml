[project]
name = "fiqa-beir"
version = "0.1.0"
description = "fiqa-beir hybrid retrieval (BM25 + dense + RRF + reranker)"
authors = [
    {name = "Ranjan Kumar",email = "ranjannjit@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s",
    "cohere",
    "datasets",
    "numpy",
    "openai",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "streamlit",
    "tiktoken",
    "tqdm",
    "ipykernel (>=7.4.0,<8.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
